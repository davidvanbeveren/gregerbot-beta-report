<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Avenir Next",Avenir,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(1000px 600px at 20% -10%,rgba(73,169,66,.28),transparent 55%),linear-gradient(160deg,#0f3d20,#14532a 55%,#196b36);color:#17281c}
  .card{background:#fff;border-radius:20px;box-shadow:0 24px 70px -24px rgba(0,0,0,.45);padding:40px 38px 32px;max-width:420px;width:100%;text-align:center}
  .logo{height:34px;margin:0 auto 6px;display:block}
  .logo-fallback{font-weight:800;color:#14532a;font-size:19px;letter-spacing:-.01em}
  .kick{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#196b36;margin:16px 0 6px}
  h1{font-size:21px;letter-spacing:-.015em;font-weight:750;margin:14px 0 20px}
  p.sub{font-size:13.5px;color:#5a675d;line-height:1.5;margin-bottom:22px}
  form{display:grid;gap:10px}
  input{font:inherit;font-size:15px;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(23,40,28,.18);outline:none;text-align:center;letter-spacing:.06em;transition:border-color .15s, box-shadow .15s}
  input:focus{border-color:#2c8c46;box-shadow:0 0 0 3px rgba(73,169,66,.18)}
  button{font:inherit;font-size:15px;font-weight:650;color:#fff;background:#196b36;border:none;border-radius:12px;padding:12px;cursor:pointer;transition:background .15s}
  button:hover{background:#14532a}
  button:disabled{opacity:.65;cursor:default}
  .err{font-size:12.5px;font-weight:600;color:#c0332e;min-height:17px;visibility:hidden}
  .err.show{visibility:visible}
  .hint{font-size:12px;color:#8a948c;margin-top:18px}
  .shake{animation:shake .35s}
  @keyframes shake{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-4px)}90%{transform:translateX(2px)}}
  @media (prefers-reduced-motion: reduce){.shake{animation:none}}
</style>

const un = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryUnlock(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:un(SALT), iterations:ITER, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:un(IV)}, key, un(CT));
  return new TextDecoder().decode(pt);
}
async function go(pw, silent){
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Unlocking\u2026"; err.classList.remove("show");
  try{
    const html = await tryUnlock(pw);
    try{ sessionStorage.setItem("gb_k", pw); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    btn.disabled = false; btn.textContent = "Unlock report";
    if(!silent){
      err.classList.add("show");
      const c = document.getElementById("card");
      c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
    }
  }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); const v = document.getElementById("pw").value; if(v) go(v, false); });
try{ const s = sessionStorage.getItem("gb_k"); if(s) go(s, true); }catch(e){}
</script>
